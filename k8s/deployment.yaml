
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-launchpad
  labels:
    app: devops-launchpad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-launchpad
  template:
    metadata:
      labels:
        app: devops-launchpad
    spec:
      containers:
        - name: devops-launchpad
          image: tufelkhan2003/devops-launchpad:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
